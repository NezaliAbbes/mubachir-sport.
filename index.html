
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081321">
<title>مباشر سبورت</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081321;color:#f5f7fb;font-family:Arial,Tahoma,sans-serif}
header{padding:18px 5%;background:#101e30;border-bottom:1px solid #263950}
h1{margin:0;color:#24d69a;font-size:25px}
header p{margin:5px 0 0;color:#a9b8cb;font-size:13px}
main{max-width:1000px;margin:22px auto;padding:0 14px}
.hero,.match,.notice{background:#101e30;border:1px solid #263950;border-radius:14px;padding:16px;margin-bottom:13px}
.hero h2{margin:0 0 6px}
.hero p,.muted{color:#a9b8cb;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button,select,input{padding:11px;border:1px solid #30445c;border-radius:9px;background:#15263a;color:white;font-size:14px}
button{cursor:pointer}
button.active,#refresh{background:#24d69a;color:#062117;border-color:#24d69a;font-weight:bold}
input{flex:1;min-width:140px}
h2{font-size:19px}
.match-top,.match-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center}
.match-top,.match-bottom{font-size:12px;color:#a9b8cb}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:22px 0;text-align:center}
.team{font-weight:bold;overflow-wrap:anywhere}
.score{font-size:23px;font-weight:bold;direction:ltr;white-space:nowrap}
.status{color:#24d69a}
.finished{color:#a9b8cb}
.scheduled{color:#64aaff}
.notice{text-align:center;color:#c6d3e2;line-height:1.8}
footer{text-align:center;padding:25px 12px;color:#a9b8cb;font-size:12px}
footer a{color:#24d69a}
@media(min-width:650px){#matches{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match{margin:0}}
</style>
</head>
<body>
<header>
<h1>⚽ مباشر سبورت</h1>
<p>نتائج رياضية حقيقية من مصدر خارجي</p>
</header>

<main>
<section class="hero">
<h2>تابع مباريات اليوم</h2>
<p>اختر الرياضة، وابحث عن الفرق، وحدّث النتائج.</p>
</section>

<div class="controls">
<select id="sport" aria-label="الرياضة">
<option value="football">⚽ كرة القدم</option>
<option value="basketball">🏀 كرة السلة</option>
<option value="tennis">🎾 التنس</option>
<option value="cricket">🏏 الكريكيت</option>
</select>
<input id="search" placeholder="ابحث عن فريق أو بطولة">
<button id="refresh">تحديث ↻</button>
</div>

<div class="controls" id="filters">
<button class="active" data-filter="all">الكل</button>
<button data-filter="live">مباشر</button>
<button data-filter="scheduled">القادمة</button>
<button data-filter="finished">المنتهية</button>
</div>

<div class="match-top" style="padding:8px 3px 14px">
<strong id="heading">مباريات كرة القدم</strong>
<span id="updated">جارٍ الاتصال...</span>
</div>

<section id="matches">
<div class="notice">جارٍ تحميل المباريات...</div>
</section>
</main>

<footer>
بيانات النتائج مقدمة من
<a href="https://sportscore.com/" rel="dofollow">SportScore</a>
<br>قد لا تتوفر بيانات جميع المباريات أو الرياضات.
</footer>

<script>
"use strict";

const API = "https://sportscore.com/api/widget/matches/";
const names = {
 football:"كرة القدم",
 basketball:"كرة السلة",
 tennis:"التنس",
 cricket:"الكريكيت"
};

let matches = [];
let filter = "all";
let busy = false;
let lastSuccess = 0;

const $ = id => document.getElementById(id);

function safe(value) {
 return String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function statusOf(m) {
 const s = String(m.status || m.status_text || "").toLowerCase();
 if (/live|in.play|in_progress|playing|half.time/.test(s)) return "live";
 if (/finish|ended|complete|full.time/.test(s)) return "finished";
 if (/upcoming|scheduled|not.started|not_started/.test(s)) return "scheduled";
 return "unknown";
}

function label(m) {
 const s = statusOf(m);
 if (s === "live") return "مباشر";
 if (s === "finished") return "انتهت";
 if (s === "scheduled") return "لم تبدأ";
 return m.status_text || m.status || "الحالة غير متاحة";
}

function timeOf(m) {
 if (!m.time) return "الوقت غير متاح";
 const d = new Date(m.time);
 if (isNaN(d.getTime())) return "الوقت غير متاح";
 return d.toLocaleString("ar-DZ", {
  day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"
 });
}

function render() {
 const q = $("search").value.trim().toLowerCase();
 const list = matches.filter(m => {
  const hay = [
   m.home,m.away,m.competition,m.league,m.tournament
  ].join(" ").toLowerCase();
  return (!q || hay.includes(q)) &&
   (filter === "all" || statusOf(m) === filter);
 });

 $("heading").textContent = "مباريات " + names[$("sport").value];

 if (!list.length) {
  $("matches").innerHTML =
   '<div class="notice">لا توجد مباريات مطابقة في البيانات المستلمة. جرّب تغيير التصفية أو تحديث النتائج.</div>';
  return;
 }

 $("matches").innerHTML = list.map(m => {
  const s = statusOf(m);
  const statusClass = s === "finished" ? "finished" :
                      s === "scheduled" ? "scheduled" : "";
  const hasScore = m.home_score != null && m.away_score != null;
  const score = hasScore
    ? safe(m.home_score) + " - " + safe(m.away_score)
    : "—";

  return `
   <article class="match">
    <div class="match-top">
     <span>${safe(m.competition || m.league || "البطولة غير محددة")}</span>
     <span>${safe(timeOf(m))}</span>
    </div>
    <div class="teams">
     <div class="team">${safe(m.home || m.home_team || "الفريق الأول")}</div>
     <div class="score">${score}</div>
     <div class="team">${safe(m.away || m.away_team || "الفريق الثاني")}</div>
    </div>
    <div class="match-bottom">
     <span>بيانات المصدر</span>
     <strong class="status ${statusClass}">${safe(label(m))}</strong>
    </div>
   </article>`;
 }).join("");
}

async function loadMatches() {
 if (busy) return;
 busy = true;
 $("updated").textContent = "جارٍ التحديث...";

 try {
  const url = API + "?sport=" +
   encodeURIComponent($("sport").value) +
   "&limit=50&src=mubasher-sport";

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  let response;
  try {
   response = await fetch(url, {
    method:"GET",
    cache:"no-store",
    signal:controller.signal
   });
  } finally {
   clearTimeout(timeout);
  }

  if (!response.ok) throw new Error("HTTP " + response.status);

  const data = await response.json();
  if (!Array.isArray(data.matches)) {
   throw new Error("صيغة بيانات غير متوقعة");
  }

  matches = data.matches;
  lastSuccess = Date.now();
  render();
  $("updated").textContent =
   "آخر تحديث " + new Date().toLocaleTimeString("ar-DZ");

 } catch (e) {
  console.error("Sports API:", e);
  $("updated").textContent = "فشل الاتصال";

  if (!lastSuccess) {
   $("matches").innerHTML =
    '<div class="notice">تعذر جلب النتائج الحقيقية.<br>' +
    'تحقق من اتصال الإنترنت أو من استجابة مصدر البيانات، ثم اضغط تحديث.<br>' +
    '<button id="retry">إعادة المحاولة</button></div>';
   const retry = $("retry");
   if (retry) retry.addEventListener("click", loadMatches);
  } else {
   render();
  }
 } finally {
  busy = false;
 }
}

$("sport").addEventListener("change", () => {
 matches = [];
 loadMatches();
});

$("search").addEventListener("input", render);
$("refresh").addEventListener("click", loadMatches);

document.querySelectorAll("[data-filter]").forEach(b => {
 b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x =>
   x.classList.toggle("active", x === b)
  );
  render();
 });
});

loadMatches();
setInterval(loadMatches, 60000);
</script>
</body>
</html>
