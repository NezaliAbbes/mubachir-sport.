
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>مباشر سبورت | النتائج الحقيقية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081321;color:#f4f7fc;font-family:Arial,Tahoma,sans-serif}
header{background:#101e30;padding:20px;border-bottom:1px solid #263950}
header h1{margin:0;color:#22d69a;font-size:26px}
header p{color:#aab9cc;margin:6px 0 0}
main{max-width:1000px;margin:22px auto;padding:0 14px}
.hero,.match,.notice{background:#101e30;border:1px solid #263950;border-radius:14px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 8px}
.muted{color:#aab9cc;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button,select,input{padding:12px;border-radius:9px;border:1px solid #30445c;background:#15263a;color:white;font-size:14px}
button{cursor:pointer}
button.active,#refresh{background:#22d69a;color:#061c14;font-weight:bold}
input{flex:1;min-width:150px}
#matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.match{margin:0;min-width:0}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aab9cc;font-size:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding:22px 0}
.team{font-weight:bold;overflow-wrap:anywhere}
.score{font-size:23px;font-weight:bold;direction:ltr;white-space:nowrap}
.status{color:#22d69a;font-weight:bold}
footer{text-align:center;color:#aab9cc;font-size:12px;padding:24px}
footer a{color:#22d69a}
.notice{text-align:center;line-height:1.8;color:#d5deea}
</style>
</head>
<body>
<header>
<h1>⚽ مباشر سبورت</h1>
<p>نتائج المباريات من مصدر البيانات الرياضي</p>
</header>

<main>
<section class="hero">
<h2>النتائج الرياضية</h2>
<p class="muted">المباريات والنتائج مع تحديث تلقائي كل دقيقة.</p>
</section>

<div class="controls">
<select id="sport" aria-label="اختر الرياضة">
<option value="football">⚽ كرة القدم</option>
<option value="basketball">🏀 كرة السلة</option>
<option value="tennis">🎾 التنس</option>
<option value="cricket">🏏 الكريكيت</option>
</select>
<input id="search" placeholder="ابحث عن فريق..." aria-label="بحث">
<button id="refresh">تحديث ↻</button>
</div>

<div class="controls" id="filters">
<button class="active" data-filter="all">الكل</button>
<button data-filter="live">مباشر</button>
<button data-filter="scheduled">القادمة</button>
<button data-filter="finished">المنتهية</button>
</div>

<p id="info" class="muted">جارٍ الاتصال بمصدر النتائج...</p>
<section id="matches">
<div class="notice">جارٍ تحميل المباريات الحقيقية...</div>
</section>
</main>

<footer>
بيانات المباريات من
<a href="https://sportscore.com/developers/api/" target="_blank" rel="noopener">SportScore API</a>
</footer>

<script>
"use strict";

const API = "https://sportscore.com/api/v1/matches/";
const $ = id => document.getElementById(id);

let games = [];
let filter = "all";
let loading = false;

function val(obj, keys) {
  for (const key of keys) {
    let v = obj;
    for (const part of key.split(".")) {
      v = v == null ? undefined : v[part];
    }
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return null;
}

function nameOf(value, fallback) {
  if (typeof value === "string" || typeof value === "number") {
    return String(value);
  }
  if (value && typeof value === "object") {
    const name = value.name || value.title || value.team_name;
    if (typeof name === "string") return name;
  }
  return fallback;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function teamNames(m) {
  return {
    home: nameOf(val(m, ["home","home_team","homeTeam","home.name"]), "اسم غير متوفر"),
    away: nameOf(val(m, ["away","away_team","awayTeam","away.name"]), "اسم غير متوفر")
  };
}

function statusOf(m) {
  const s = String(val(m, ["status","status_text","state"]) || "").toLowerCase();
  if (/live|in.play|in_progress|playing|half.time/.test(s)) return "live";
  if (/finished|ended|complete|full.time/.test(s)) return "finished";
  if (/scheduled|upcoming|not.started|not_started/.test(s)) return "scheduled";
  return "unknown";
}

function statusText(m) {
  const s = statusOf(m);
  if (s === "live") return "مباشر";
  if (s === "finished") return "انتهت";
  if (s === "scheduled") return "لم تبدأ";
  return String(val(m, ["status_text","status"]) || "الحالة غير متاحة");
}

function scoreOf(m) {
  const h = val(m, ["home_score","homeScore","score.home"]);
  const a = val(m, ["away_score","awayScore","score.away"]);
  if (h === null || a === null) return "—";
  return esc(h) + " - " + esc(a);
}

function timeOf(m) {
  const raw = val(m, ["time","start_time","startTime","date"]);
  if (!raw) return "الوقت غير متاح";
  const d = new Date(raw);
  if (isNaN(d.getTime())) return "الوقت غير متاح";
  return d.toLocaleString("ar-DZ", {
    day:"2-digit",month:"2-digit",
    hour:"2-digit",minute:"2-digit"
  });
}

function leagueOf(m) {
  return nameOf(val(m, [
    "competition","league","tournament",
    "competition.name","league.name","tournament.name"
  ]), "البطولة غير محددة");
}

function render() {
  const q = $("search").value.trim().toLowerCase();

  const list = games.filter(m => {
    const n = teamNames(m);
    const searchable = (n.home + " " + n.away + " " + leagueOf(m)).toLowerCase();
    return (!q || searchable.includes(q)) &&
      (filter === "all" || statusOf(m) === filter);
  });

  if (!list.length) {
    $("matches").innerHTML =
      '<div class="notice">لا توجد مباريات تطابق الاختيار الحالي.</div>';
    return;
  }

  $("matches").innerHTML = list.map(m => {
    const n = teamNames(m);
    const s = statusOf(m);
    const cls = s === "finished" ? "muted" : "status";

    return `<article class="match">
      <div class="top">
        <span>${esc(leagueOf(m))}</span>
        <span>${esc(timeOf(m))}</span>
      </div>
      <div class="teams">
        <div class="team">${esc(n.home)}</div>
        <div class="score">${scoreOf(m)}</div>
        <div class="team">${esc(n.away)}</div>
      </div>
      <div class="bottom">
        <span>النتيجة</span>
        <span class="${cls}">${esc(statusText(m))}</span>
      </div>
    </article>`;
  }).join("");
}

async function load() {
  if (loading) return;
  loading = true;
  $("info").textContent = "جارٍ تحديث النتائج...";

  try {
    const url = API + "?sport=" +
      encodeURIComponent($("sport").value) + "&limit=20";

    const response = await fetch(url, {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();

    if (!Array.isArray(data.matches)) {
      throw new Error("صيغة استجابة غير متوقعة");
    }

    games = data.matches;
    render();

    $("info").textContent =
      "عدد المباريات المستلمة: " + games.length +
      " | آخر تحديث: " +
      new Date().toLocaleTimeString("ar-DZ");

  } catch (e) {
    console.error(e);
    $("info").textContent = "تعذر الاتصال بمصدر النتائج.";
    $("matches").innerHTML =
      '<div class="notice">لم نتمكن من تحميل البيانات. ' +
      'تحقق من الإنترنت ثم اضغط «تحديث».</div>';
  } finally {
    loading = false;
  }
}

$("sport").addEventListener("change", load);
$("refresh").addEventListener("click", load);
$("search").addEventListener("input", render);

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    render();
  });
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
