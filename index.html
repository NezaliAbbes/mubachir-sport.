<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>مباشر سبورت | النتائج المباشرة</title>
<meta name="description" content="تابع النتائج الرياضية المباشرة ومباريات اليوم.">

<style>
*{box-sizing:border-box}
body{margin:0;background:#081321;color:#f4f7fc;font-family:Arial,Tahoma,sans-serif}
header{background:#101e30;padding:20px 16px;border-bottom:1px solid #263950}
header h1{margin:0;color:#22d69a;font-size:27px}
header p{color:#aab9cc;margin:8px 0 0}
main{max-width:1100px;margin:22px auto;padding:0 14px}
.hero,.match,.notice{background:#101e30;border:1px solid #263950;border-radius:14px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 8px}
.muted{color:#aab9cc;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button,select,input{padding:12px;border-radius:9px;border:1px solid #30445c;background:#15263a;color:white;font-size:14px}
button{cursor:pointer}
button:disabled{opacity:.6}
button.active,#refresh{background:#22d69a;color:#061c14;font-weight:bold}
input{flex:1;min-width:140px}
#matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.match{margin:0;min-width:0}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#aab9cc;font-size:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding:22px 0}
.team{font-weight:bold;overflow-wrap:anywhere}
.score{font-size:23px;font-weight:bold;direction:ltr;white-space:nowrap}
.status{color:#22d69a;font-weight:bold}
.finished{color:#aab9cc}
.notice{text-align:center;line-height:1.9;color:#d5deea}
.error{border-color:#8b4545}
footer{text-align:center;color:#aab9cc;font-size:12px;padding:24px 12px}
footer a{color:#22d69a}
#info{line-height:1.8}
</style>
</head>

<body>
<header>
  <h1>⚽ مباشر سبورت</h1>
  <p>نتائج المباريات الرياضية وتحديثات اليوم</p>
</header>

<main>
  <section class="hero">
    <h2>🏆 النتائج الرياضية</h2>
    <p class="muted">اختر الرياضة وابحث عن فريقك وتابع نتائج المباريات.</p>
  </section>

  <div class="controls">
    <select id="sport" aria-label="اختر الرياضة">
      <option value="football">⚽ كرة القدم</option>
      <option value="basketball">🏀 كرة السلة</option>
      <option value="tennis">🎾 التنس</option>
      <option value="cricket">🏏 الكريكيت</option>
    </select>
    <input id="search" type="search" placeholder="ابحث عن فريق أو بطولة...">
    <button id="refresh" type="button">تحديث ↻</button>
  </div>

  <div class="controls">
    <button class="active" data-filter="all">الكل</button>
    <button data-filter="live">🔴 مباشر</button>
    <button data-filter="scheduled">القادمة</button>
    <button data-filter="finished">المنتهية</button>
  </div>

  <p id="info" class="muted" aria-live="polite">جارٍ الاتصال بمصدر النتائج...</p>

  <section id="matches" aria-live="polite">
    <div class="notice">جارٍ تحميل المباريات...</div>
  </section>
</main>

<footer>
  <p>مصدر البيانات:
    <a href="https://sportscore.com/" target="_blank" rel="noopener noreferrer">SportScore</a>
  </p>
  <p>مباشر سبورت © 2026</p>
</footer>

<script>
"use strict";

const API = "https://sportscore.com/api";
const $ = id => document.getElementById(id);

let games = [];
let filter = "all";
let loading = false;
let timer = null;

function pick(obj, paths) {
  for (const path of paths) {
    let v = obj;
    for (const key of path.split(".")) {
      v = v == null ? undefined : v[key];
    }
    if (v !== undefined && v !== null && v !== "") return v;
  }
  return null;
}

function textOf(value, fallback) {
  if (typeof value === "string" || typeof value === "number") {
    return String(value);
  }
  if (value && typeof value === "object") {
    return String(value.name || value.title || value.shortName || fallback);
  }
  return fallback;
}

function teamsOf(m) {
  return {
    home: textOf(pick(m, [
      "home", "home_team", "homeTeam",
      "home.name", "home_team.name", "homeTeam.name"
    ]), "الفريق الأول"),
    away: textOf(pick(m, [
      "away", "away_team", "awayTeam",
      "away.name", "away_team.name", "awayTeam.name"
    ]), "الفريق الثاني")
  };
}

function leagueOf(m) {
  return textOf(pick(m, [
    "competition", "league", "tournament",
    "competition.name", "league.name", "tournament.name"
  ]), "البطولة غير محددة");
}

function statusOf(m) {
  let raw = pick(m, ["status", "state", "status_text", "status.name"]);
  if (raw && typeof raw === "object") {
    raw = raw.name || raw.type || raw.description || "";
  }

  const s = String(raw || "").toLowerCase().replace(/[\s.-]+/g, "_");

  if (/live|in_play|in_progress|playing|first_half|second_half|halftime|half_time|overtime|period_/.test(s)) return "live";
  if (/finished|ended|complete|full_time|after_extra_time|penalties|final/.test(s)) return "finished";
  if (/scheduled|upcoming|not_started|notstarted|timed|fixture|postponed/.test(s)) return "scheduled";

  return "unknown";
}

function statusText(m) {
  const s = statusOf(m);
  if (s === "live") return "🔴 مباشر";
  if (s === "finished") return "انتهت";
  if (s === "scheduled") return "قادمة";

  return textOf(pick(m, ["status_text", "status.name", "status"]), "الحالة غير متاحة");
}

function scoreOf(m) {
  const h = pick(m, [
    "home_score", "homeScore", "score.home",
    "scores.home", "home.score"
  ]);
  const a = pick(m, [
    "away_score", "awayScore", "score.away",
    "scores.away", "away.score"
  ]);

  return h == null || a == null ? "—" : String(h) + " - " + String(a);
}

function timeOf(m) {
  const raw = pick(m, ["time", "start_time", "startTime", "date", "kickoff", "scheduled_at"]);
  if (!raw) return "الوقت غير متاح";

  const d = new Date(raw);
  if (Number.isNaN(d.getTime())) return "الوقت غير متاح";

  return d.toLocaleString("ar-DZ", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

function extractList(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.matches)) return data.matches;
  if (data && Array.isArray(data.fixtures)) return data.fixtures;
  if (data && Array.isArray(data.data)) return data.data;
  if (data && data.data) return extractList(data.data);
  if (data && Array.isArray(data.results)) return data.results;
  return null;
}

function uniqueMatches(items) {
  const seen = new Set();

  return items.filter(m => {
    const t = teamsOf(m);
    const key = String(
      pick(m, ["slug", "id", "match_id"]) ||
      (t.home + "|" + t.away + "|" + String(pick(m, ["time", "date", "start_time"]) || ""))
    );

    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function render() {
  const q = $("search").value.trim().toLocaleLowerCase();

  const list = games.filter(m => {
    const t = teamsOf(m);
    const searchable = (t.home + " " + t.away + " " + leagueOf(m)).toLocaleLowerCase();

    return (!q || searchable.includes(q)) &&
      (filter === "all" || statusOf(m) === filter);
  });

  if (!list.length) {
    $("matches").innerHTML =
      '<div class="notice">لا توجد مباريات مطابقة للاختيار الحالي ضمن البيانات المستلمة.</div>';
    return;
  }

  $("matches").innerHTML = list.map(m => {
    const t = teamsOf(m);
    const s = statusOf(m);

    return `
      <article class="match">
        <div class="top">
          <span>${escapeHTML(leagueOf(m))}</span>
          <span>${escapeHTML(timeOf(m))}</span>
        </div>
        <div class="teams">
          <div class="team">${escapeHTML(t.home)}</div>
          <div class="score">${escapeHTML(scoreOf(m))}</div>
          <div class="team">${escapeHTML(t.away)}</div>
        </div>
        <div class="bottom">
          <span>النتيجة</span>
          <span class="${s === "finished" ? "finished" : "status"}">${escapeHTML(statusText(m))}</span>
        </div>
      </article>`;
  }).join("");
}

async function getJSON(url) {
  const response = await fetch(url, {
    method: "GET",
    cache: "no-store",
    headers: { "Accept": "application/json" }
  });

  if (!response.ok) throw new Error("HTTP " + response.status);
  return response.json();
}

async function loadMatches() {
  if (loading) return;
  loading = true;
  $("refresh").disabled = true;
  $("info").textContent = "جارٍ تحديث النتائج الحقيقية...";

  const sport = $("sport").value;
  const today = new Date().toISOString().slice(0, 10);

  const urls = [
    `${API}/widget/matches/?sport=${encodeURIComponent(sport)}&limit=50`,
    `${API}/v1/fixtures/?sport=${encodeURIComponent(sport)}&date=${today}&limit=100`
  ];

  try {
    const results = await Promise.allSettled(urls.map(getJSON));
    let received = [];
    let successes = 0;

    for (const result of results) {
      if (result.status === "fulfilled") {
        const list = extractList(result.value);
        if (list) {
          received = received.concat(list);
          successes++;
        }
      } else {
        console.warn("تعذر جلب أحد مصادر البيانات:", result.reason);
      }
    }

    if (successes === 0) {
      throw new Error("لم يستجب مصدر النتائج بصيغة JSON متوقعة.");
    }

    games = uniqueMatches(received);
    render();

    $("info").textContent =
      "الرياضة: " + sport +
      " | المباريات: " + games.length +
      " | آخر تحديث: " + new Date().toLocaleTimeString("ar-DZ");

  } catch (error) {
    console.error(error);
    $("info").textContent = "تعذر جلب النتائج. تحقق من الاتصال وحاول مجدداً.";

    if (!games.length) {
      $("matches").innerHTML =
        '<div class="notice error">لم تصل بيانات من المصدر. ' +
        'لا نعرض نتائج وهمية. اضغط تحديث للمحاولة مرة أخرى.</div>';
    }
  } finally {
    loading = false;
    $("refresh").disabled = false;
  }
}

$("sport").addEventListener("change", loadMatches);
$("refresh").addEventListener("click", loadMatches);
$("search").addEventListener("input", render);

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    render();
  });
});

loadMatches();
timer = setInterval(loadMatches, 60000);
</script>
</body>
</html>
