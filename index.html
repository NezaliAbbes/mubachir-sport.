<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<meta name="description" content="مباشر سبورت: متابعة نتائج المباريات الرياضية وتحديثها تلقائياً.">
<title>مباشر سبورت | النتائج المباشرة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#081321;color:#f4f7fc;
  font-family:Arial,Tahoma,sans-serif
}
header{
  background:#101e30;padding:20px 16px;
  border-bottom:1px solid #263950
}
header h1{margin:0;color:#22d69a;font-size:26px}
header p{color:#aab9cc;margin:8px 0 0;font-size:14px}
main{max-width:1100px;margin:22px auto;padding:0 14px}
.hero,.match,.notice{
  background:#101e30;border:1px solid #263950;
  border-radius:14px;padding:16px;margin-bottom:12px
}
.hero h2{margin:0 0 8px}
.muted{color:#aab9cc;font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button,select,input{
  padding:12px;border-radius:9px;
  border:1px solid #30445c;background:#15263a;
  color:white;font-size:14px
}
button{cursor:pointer}
button.active,#refresh{
  background:#22d69a;color:#061c14;font-weight:bold
}
input{flex:1;min-width:140px}
#matches{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
  gap:12px
}
.match{margin:0;min-width:0}
.top,.bottom{
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;color:#aab9cc;font-size:12px
}
.teams{
  display:grid;grid-template-columns:1fr auto 1fr;
  gap:8px;align-items:center;text-align:center;padding:22px 0
}
.team{font-weight:bold;overflow-wrap:anywhere}
.score{
  font-size:23px;font-weight:bold;direction:ltr;white-space:nowrap
}
.status{color:#22d69a;font-weight:bold}
.finished{color:#aab9cc}
.notice{text-align:center;line-height:1.9;color:#d5deea}
.error{border-color:#8b4545}
footer{text-align:center;color:#aab9cc;font-size:12px;padding:25px 12px}
footer a{color:#22d69a}
#info{line-height:1.8}
</style>
</head>

<body>
<header>
  <h1>⚽ مباشر سبورت</h1>
  <p>النتائج الرياضية وتحديثات المباريات</p>
</header>

<main>
  <section class="hero">
    <h2>🏆 النتائج الرياضية</h2>
    <p class="muted">
      اختر الرياضة وابحث عن فريقك. يتم تحديث البيانات تلقائياً كل دقيقة.
    </p>
  </section>

  <div class="controls">
    <select id="sport" aria-label="اختر الرياضة">
      <option value="football">⚽ كرة القدم</option>
      <option value="basketball">🏀 كرة السلة</option>
      <option value="tennis">🎾 التنس</option>
      <option value="cricket">🏏 الكريكيت</option>
    </select>
    <input id="search" type="search"
           placeholder="ابحث عن فريق أو بطولة..."
           aria-label="بحث">
    <button id="refresh" type="button">تحديث ↻</button>
  </div>

  <div class="controls" id="filters">
    <button class="active" data-filter="all">الكل</button>
    <button data-filter="live">مباشر</button>
    <button data-filter="scheduled">القادمة</button>
    <button data-filter="finished">المنتهية</button>
  </div>

  <p id="info" class="muted" aria-live="polite">
    جارٍ الاتصال بمصدر النتائج...
  </p>

  <section id="matches" aria-live="polite">
    <div class="notice">جارٍ تحميل المباريات...</div>
  </section>
</main>

<footer>
  <p>بيانات النتائج مقدمة من
    <a href="https://sportscore.com/" target="_blank"
       rel="noopener noreferrer">SportScore</a>
  </p>
  <p>Powered by SportScore</p>
  <p>مباشر سبورت © 2026</p>
</footer>

<script>
"use strict";

const API = "https://sportscore.com/api/widget/matches/";
const $ = id => document.getElementById(id);

let games = [];
let filter = "all";
let loading = false;
let requestNumber = 0;
let lastUpdate = null;
let timer = null;

function getValue(obj, paths) {
  for (const path of paths) {
    let value = obj;
    for (const part of path.split(".")) {
      value = value == null ? undefined : value[part];
    }
    if (value !== undefined && value !== null && value !== "") {
      return value;
    }
  }
  return null;
}

function teamName(value) {
  if (typeof value === "string" || typeof value === "number") {
    return String(value);
  }

  if (value && typeof value === "object") {
    return String(
      value.name ??
      value.title ??
      value.team_name ??
      value.shortName ??
      "اسم غير متوفر"
    );
  }

  return "اسم غير متوفر";
}

function teamsOf(match) {
  return {
    home: teamName(getValue(match, [
      "home", "home_team", "homeTeam",
      "home.name", "home_team.name", "homeTeam.name"
    ])),
    away: teamName(getValue(match, [
      "away", "away_team", "awayTeam",
      "away.name", "away_team.name", "awayTeam.name"
    ]))
  };
}

function competitionOf(match) {
  return teamName(getValue(match, [
    "competition", "league", "tournament",
    "competition.name", "league.name", "tournament.name"
  ]) ?? "البطولة غير محددة");
}

function statusOf(match) {
  const raw = getValue(match, [
    "status", "status_text", "state", "status.type"
  ]);

  if (raw && typeof raw === "object") {
    return statusOf({status: raw.name ?? raw.type ?? raw.description ?? ""});
  }

  const s = String(raw ?? "").toLowerCase().replace(/[\s.-]+/g, "_");

  if (/live|in_play|inprogress|playing|first_half|second_half|halftime|half_time|overtime|period_/.test(s)) {
    return "live";
  }

  if (/finished|ended|complete|full_time|after_extra_time|penalties|final/.test(s)) {
    return "finished";
  }

  if (/scheduled|upcoming|not_started|notstarted|timed|fixture|postponed/.test(s)) {
    return "scheduled";
  }

  return "unknown";
}

function statusText(match) {
  const status = statusOf(match);

  if (status === "live") return "🔴 مباشر";
  if (status === "finished") return "انتهت";
  if (status === "scheduled") return "قادمة";

  return String(getValue(match, [
    "status_text", "status.name", "status"
  ]) ?? "الحالة غير متاحة");
}

function scoreOf(match) {
  const home = getValue(match, [
    "home_score", "homeScore", "score.home",
    "scores.home", "home.score"
  ]);

  const away = getValue(match, [
    "away_score", "awayScore", "score.away",
    "scores.away", "away.score"
  ]);

  if (home === null || away === null) return "—";
  return String(home) + " - " + String(away);
}

function timeOf(match) {
  const raw = getValue(match, [
    "time", "start_time", "startTime", "date",
    "kickoff", "scheduled_at"
  ]);

  if (!raw) return "الوقت غير متاح";

  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return "الوقت غير متاح";

  return date.toLocaleString("ar-DZ", {
    day: "2-digit",
    month: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function render() {
  const query = $("search").value.trim().toLocaleLowerCase();
  const list = games.filter(match => {
    const teams = teamsOf(match);
    const searchable = (
      teams.home + " " + teams.away + " " + competitionOf(match)
    ).toLocaleLowerCase();

    return (!query || searchable.includes(query)) &&
      (filter === "all" || statusOf(match) === filter);
  });

  if (!list.length) {
    $("matches").innerHTML =
      '<div class="notice">لا توجد مباريات مطابقة لهذا الاختيار حالياً.</div>';
    return;
  }

  $("matches").innerHTML = list.map(match => {
    const teams = teamsOf(match);
    const status = statusOf(match);
    const statusClass = status === "finished" ? "finished" : "status";

    return `
      <article class="match">
        <div class="top">
          <span>${escapeHTML(competitionOf(match))}</span>
          <span>${escapeHTML(timeOf(match))}</span>
        </div>

        <div class="teams">
          <div class="team">${escapeHTML(teams.home)}</div>
          <div class="score">${escapeHTML(scoreOf(match))}</div>
          <div class="team">${escapeHTML(teams.away)}</div>
        </div>

        <div class="bottom">
          <span>النتيجة</span>
          <span class="${statusClass}">${escapeHTML(statusText(match))}</span>
        </div>
      </article>
    `;
  }).join("");
}

async function loadMatches() {
  if (loading) return;

  loading = true;
  const currentRequest = ++requestNumber;
  $("refresh").disabled = true;
  $("info").textContent = "جارٍ تحديث النتائج...";

  try {
    const sport = $("sport").value;
    const url = API + "?sport=" +
      encodeURIComponent(sport) + "&limit=50";

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (currentRequest !== requestNumber) return;

    const list = Array.isArray(data.matches)
      ? data.matches
      : Array.isArray(data.data)
        ? data.data
        : Array.isArray(data)
          ? data
          : null;

    if (!list) {
      throw new Error("صيغة البيانات غير متوقعة");
    }

    games = list;
    lastUpdate = new Date();
    render();

    $("info").textContent =
      "الرياضة: " + sport +
      " | المباريات المستلمة: " + games.length +
      " | آخر تحديث: " +
      lastUpdate.toLocaleTimeString("ar-DZ");

  } catch (error) {
    console.error("SportScore:", error);

    $("info").textContent =
      "تعذر تحديث البيانات. تحقق من الإنترنت وحاول مجدداً.";

    if (!games.length) {
      $("matches").innerHTML =
        '<div class="notice error">' +
        'لم تصل بيانات المباريات من المصدر. ' +
        'اضغط «تحديث» للمحاولة مرة أخرى.' +
        '</div>';
    }
  } finally {
    loading = false;
    $("refresh").disabled = false;
  }
}

$("sport").addEventListener("change", () => {
  games = [];
  render();
  loadMatches();
});

$("refresh").addEventListener("click", loadMatches);
$("search").addEventListener("input", render);

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    render();
  });
});

loadMatches();
timer = setInterval(loadMatches, 60000);
</script>
</body>
</html>
